<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a2b" />
      <stop offset="100%" stop-color="#1f3b57" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#4fd8ff" stroke-opacity="0.35" stroke-width="1" />
    </pattern>
    <pattern id="gridBig" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0 L0 0 0 160" fill="none" stroke="#4fd8ff" stroke-opacity="0.6" stroke-width="1.5" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <rect width="800" height="600" fill="url(#grid)" />
  <rect width="800" height="600" fill="url(#gridBig)" />
  <circle cx="620" cy="150" r="90" fill="#ff5fb0" opacity="0.25" />
  <circle cx="150" cy="450" r="120" fill="#4fd8ff" opacity="0.2" />
</svg>
